<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Драбинка абзаців</title>
    <style>
        p {
            background-color: #64f2a7;
            border: 2px dotted #4caf50;
            text-align: center;
            margin: 15px auto;
            padding: 15px;
            color: #555;
            font-family: Arial, sans-serif;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <script type="text/javascript">
        // Початкова ширина першого абзацу
        let currentWidth = 200; 

        // Цикл для виведення 5 абзаців
        for (let i = 1; i <= 5; i++) {
            // Значення ширини підставляється в атрибут style=""
            document.write('<p style="width: ' + currentWidth + 'px;">Абзац ' + i + '</p>');
            
            // Збільшуємо ширину для наступного кроку на 100px
            currentWidth += 100;
        }
    </script>

</body>
</html>
