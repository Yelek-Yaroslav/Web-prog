<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Завдання 2 - факторіал</title>
</head>
<body>
  <h1>Завдання 2: факторіал рекурсією</h1>
  <pre id="output"></pre>

  <script>
    function factorialRecursion(n) {
      if (n <= 1) {
        return 1;
      }
      return n * factorialRecursion(n - 1);
    }

    const lines = [0, 1, 5, 10].map(
      (n) => `factorialRecursion(${n}) = ${factorialRecursion(n)}`
    );

    console.log(lines.join("\n"));
    document.getElementById("output").textContent = lines.join("\n");
  </script>
</body>
</html>
